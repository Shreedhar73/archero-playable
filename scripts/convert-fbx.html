<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FBX to GLB</title>
  </head>
  <body>
    <script type="module">
      // Conversion has to happen in a browser when the FBX carries embedded
      // textures: FBXLoader hands them to ImageLoader, and GLTFExporter reads
      // them back off the decoded Image. Node has neither, so a headless stub
      // converts the geometry and silently drops every texture.
      //
      // Driven by scripts/fbx-to-glb.mjs, which reads window.__result.
      import * as THREE from "three";
      import { FBXLoader } from "three/examples/jsm/loaders/FBXLoader.js";
      import { GLTFExporter } from "three/examples/jsm/exporters/GLTFExporter.js";

      const src = new URLSearchParams(location.search).get("src");
      try {
        const group = await new FBXLoader().loadAsync(src);

        // loadAsync resolves when the FBX tree is parsed, but the embedded
        // textures are still decoding: FBXLoader hands each one to ImageLoader
        // as a blob URL and does not wait. Exporting now throws "No valid
        // image data found", because the Image has no pixels yet.
        window.__materials = [];
        group.traverse((node) => {
          if (!node.isMesh && !node.isSkinnedMesh) return;
          const mats = Array.isArray(node.material) ? node.material : [node.material];
          for (const m of mats) {
            window.__materials.push({
              mesh: node.name,
              mat: m?.name,
              type: m?.type,
              slots: Object.keys(m ?? {}).filter((k) => /map$/i.test(k) && m[k]),
              image: m?.map?.image
                ? { kind: m.map.image.constructor?.name, w: m.map.image.width ?? m.map.image.naturalWidth }
                : null,
            });
          }
        });
        // Mixamo's character FBXs embed their textures as "Content" records
        // that FBXLoader does not unpack — every map ends up with image null,
        // and GLTFExporter then dies on "No valid image data found". The maps
        // are dropped here and the images are reattached from the FBX binary
        // by scripts/extract-fbx-textures.mjs, which can read those records.
        group.traverse((node) => {
          const materials = Array.isArray(node.material) ? node.material : [node.material];
          for (const material of materials) {
            for (const slot of ["map", "normalMap", "emissiveMap", "roughnessMap", "alphaMap", "specularMap"]) {
              if (material?.[slot] && !material[slot].image) material[slot] = null;
            }
          }
        });

        const images = new Set();
        group.traverse((node) => {
          const materials = Array.isArray(node.material) ? node.material : [node.material];
          for (const material of materials) {
            for (const slot of ["map", "normalMap", "emissiveMap", "roughnessMap"]) {
              const image = material?.[slot]?.image;
              if (image instanceof HTMLImageElement) images.add(image);
            }
          }
        });
        await Promise.all(
          [...images].map(
            (image) =>
              new Promise((done) => {
                if (image.complete && image.naturalWidth > 0) return done();
                image.addEventListener("load", done, { once: true });
                image.addEventListener("error", done, { once: true });
              }),
          ),
        );
        window.__textures = [...images].map((image) => ({
          src: String(image.src ?? "").slice(0, 80),
          kind: image.constructor?.name,
          complete: image.complete,
          width: image.naturalWidth,
        }));
        const glb = await new GLTFExporter().parseAsync(group, {
          binary: true,
          animations: group.animations,
          // Embedded FBX textures arrive as blob: URLs; the exporter has to
          // rasterize them into the GLB rather than reference them.
          embedImages: true,
        });
        let binary = "";
        const bytes = new Uint8Array(glb);
        // btoa in 32 KB slices: one spread of a 20 MB array blows the stack.
        for (let i = 0; i < bytes.length; i += 32768) {
          binary += String.fromCharCode(...bytes.subarray(i, i + 32768));
        }
        const meshes = [];
        group.traverse((node) => {
          if (!node.isMesh && !node.isSkinnedMesh) return;
          const size = new THREE.Box3()
            .setFromObject(node)
            .getSize(new THREE.Vector3());
          const materials = Array.isArray(node.material) ? node.material : [node.material];
          meshes.push({
            name: node.name,
            verts: node.geometry.attributes.position.count,
            size: size.toArray().map((v) => Math.round(v)),
            materials: materials.map((m) => m?.name ?? "?"),
            textured: materials.some((m) => Boolean(m?.map)),
          });
        });
        window.__result = {
          glb: btoa(binary),
          meshes,
          clips: group.animations.map((c) => ({ name: c.name, duration: c.duration })),
        };
      } catch (error) {
        window.__result = { error: String(error?.stack ?? error), textures: window.__textures };
      }
    </script>
  </body>
</html>
